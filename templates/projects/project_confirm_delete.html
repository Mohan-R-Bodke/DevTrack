<!DOCTYPE html>
<html>

<head>
    <title>Delete Project</title>
</head>

<body>

    <h1>Delete Project</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ project.title }}</strong>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

    </form>

    <br>

    <a href="{% url 'project_detail' project.id %}">
        Cancel
    </a>

</body>

</html>
